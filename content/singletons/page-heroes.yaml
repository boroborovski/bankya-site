zaNas:
  headline: За нас
  subheadline: >-
    Повече от 50 години специализирана рехабилитация в уникалната природна среда
    на Банкя.
  ctaLabel: Нашият екип
  ctaUrl: '#team'
  secondaryCtaLabel: Нашите дейности
  secondaryCtaUrl: /deynosti
zaPatsienta:
  headline: Информация за пациенти
  subheadline: >-
    Всичко, което трябва да знаете преди постъпване — начини на прием,
    необходими документи и условия на лечение.
  ctaLabel: Запишете час
deynosti:
  headline: Нашите дейности
  subheadline: >-
    Комплексна рехабилитация в шест специализирани направления, съчетаваща
    природните ресурси на Банкя с модерни медицински методи.
galeriya:
  headline: Галерия
  subheadline: >-
    Разгледайте нашата болнична база, рехабилитационните зали, балнеологичните
    съоръжения и красивата природна среда на Банкя.
novini:
  headline: Новини
  subheadline: Последни новини и актуална информация от БПЛР–Банкя.
kontakti:
  headline: Свържете се с нас
  subheadline: >-
    Ще се радваме да отговорим на вашите въпроси и да ви помогнем с избора на
    подходяща рехабилитационна програма.
