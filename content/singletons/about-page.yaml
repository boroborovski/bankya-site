missionHeading: Нашата мисия
missionBody: БПЛР–Банкя е специализирана болница за продължително лечение и рехабилитация, предлагаща комплексна медицинска грижа в уникалната природна среда на Банкя. Нашата мисия е да осигурим пълноценно възстановяване на всеки пациент.
missionBody2: Болницата разполага с модерна балнеологична база, физиотерапевтични кабинети и специализирани отделения за неврологична, ортопедична и кардиологична рехабилитация. Лечението се провежда от висококвалифицирани лекари и рехабилитатори.
missionBullets:
  - text: Акредитирано лечебно заведение от II ниво
  - text: Договор с НЗОК по клинични пътеки
  - text: Природна минерална вода с доказан лечебен ефект
  - text: Индивидуален рехабилитационен план за всеки пациент
  - text: Комфортно настаняване в болничната база
stats:
