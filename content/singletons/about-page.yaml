mineralHeading: Минералната вода на Банкя
mineralBody: 'Болницата ползва природна минерална вода от Сондаж №2хг, намиращ се непосредствено до сградата — с дълбочина 364,12 м, дебит 0,38–5 л/сек и температура 36°С. Водата е алкална (рН 9,7), хомотермална, слабо минерализирана, хидрокарбонатно-сулфатно-натриева-азотна. Общ йонен сбор: 333,28 мг/л.'
mineralBody2: 'Ключови компоненти (мг/л): Флуор 1,60 · Хлор 9,02 · Сулфат 65,43 · Хидрокарбонат 26,19 · Натрий 70,32 · Калий 4,06 · Калций 2,45 · Метасилициева киселина 52,65 · Метаборна киселина 4,47. Прилагат се водолечебни процедури — минерални вани (обикновени, хидромасажни, тангентори), минерален басейн и питейно лечение.'
mineralBullets:
  - text: Алкална вода, рН 9,7 — слабо минерализирана
  - text: Температура 36°С — хомотермална (идеална за балнеолечение)
  - text: Хидрокарбонатно-сулфатно-натриева-азотна
  - text: Обикновени вани и басейн, хидромасажни вани и басейн, платен плувен басейн
  - text: Минерален басейн и питейно лечение
timelineEvents:
  - year: '1913'
    title: Основаване на Войнишкия санаториум
    description: На 12 юли 1913 г. е открит Войнишкият санаториум в с. Банкя — първият военен санаториум в България. Създаден за лечение на ранените и заболелите от Балканската война, осигурявал храна, легло, медицинска помощ и минерални бани.
  - year: '1915'
    title: Офицерско отделение с 25 легла
    description: Към санаториума е разкрито офицерско отделение с 25 легла по заповед на началника на Първа Софийска дивизионна болница.
  - year: '1926'
    title: Дарение на семейство Иванови
    description: Запасният майор Никола К. Иванов и съпругата му Елена даряват 1 милион лева (утроени впоследствие) и 1 699 кв.м. земя за построяване на санаториум за военноинвалидите.
  - year: '1928'
    title: Завършена нова сграда — Блок Б
    description: През май 1928 г. санаториумът е завършен и открит. Красивата сграда е построена с дарение на семейство Домна и Михаил Теневи в памет на загиналия им син майор Коста Паница.
  - year: '1955'
    title: Военен санаториум към Медицинско управление на ГЩ
    description: Утвърден като военен санаториум с постепенна специализация за лечение и възстановяване след сърдечно-съдови, мозъчно-съдови и неврологични заболявания.
  - year: '1971'
    title: Нова осеметажна сграда — Блок А
    description: Завършена и въведена в експлоатация от април 1971 г. Разкрити са водолечебен сектор, физиотерапия, две зали за двигателна рехабилитация, функционална диагностика и зала за интензивни грижи.
  - year: '1998'
    title: Присъединяване към ВМА
    description: Санаториумът е включен в структурата на Военномедицинската академия.
  - year: '2017'
    title: БПЛР–Банкя към ВМА
    description: С промените в Закона за лечебните заведения болницата получава настоящото си наименование. Завършена е реставрацията на киносалона — уникален конферентен и културно-развлекателен център на болницата и града. Ремонтирани и обновени болнични стаи.
