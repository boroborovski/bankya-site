mineralHeading: Минералната вода на Банкя
mineralBody: Банкя е известна с уникалната си минерална вода — слабо минерализирана, хипотонична, с температура около 37°C. Тя е особено ефективна при заболявания на опорно-двигателния апарат, неврологични и кожни заболявания.
mineralBody2: В болницата се прилагат различни видове балнеолечение — общи и частични вани, подводен душ-масаж, подводна гимнастика и хидрокинезитерапия, всичко в съвременно оборудвана балнеологична база.
mineralBullets:
  - text: Слабо минерализирана вода с оптимална температура
  - text: Показана при ставни, неврологични и кожни заболявания
  - text: Процедури в модерна балнеологична база
  - text: Ефективна в комбинация с физиотерапия
timelineEvents:
  - year: "1972"
    title: Основаване на болницата
    description: БПЛР–Банкя е открита като специализирано лечебно заведение към Военномедицинска академия, ползвайки уникалните минерални ресурси на Банкя.
  - year: "1990"
    title: Разширяване на капацитета
    description: Изграждане на нови отделения и модернизиране на балнеологичните съоръжения. Увеличаване на леглата до над 200.
  - year: "2005"
    title: Акредитация и НЗОК договор
    description: Болницата получава пълна акредитация и сключва договор с НЗОК за прием по клинични пътеки, правейки рехабилитацията достъпна за широк кръг пациенти.
  - year: "2015"
    title: Модернизация на отделенията
    description: Обновяване на физиотерапевтичната и рехабилитационната база с ново медицинско оборудване.
  - year: "2023"
    title: Разширяване на услугите
    description: Въвеждане на нови рехабилитационни програми и разширяване на сътрудничеството с водещи медицински центрове в страната.
