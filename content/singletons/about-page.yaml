missionHeading: Нашата мисия
missionBody: БПЛР–Банкя е болница за продължително лечение и рехабилитация към Военномедицинска академия — специализирано лечебно заведение с повече от 113-годишна история. Мисията ни е да проведем физикално лечение, моторна и психична рехабилитация, балнеолечение, теренно и климатолечение на пациенти с хронични заболявания, както и ранна рехабилитация след болнично лечение на остри заболявания.
missionBody2: Работим по три основни направления — ранна рехабилитация непосредствено след активното лечение; продължително лечение с последваща рехабилитация; и първична и вторична профилактика. Дейността на висококвалифицирания ни персонал използва лечебните свойства на минералната вода и природните фактори на Банкя, съчетани с физиотерапевтично и медикаментозно лечение.
missionBullets:
  - text: Основана на 12 юли 1913 г. — първият военен санаториум в България
  - text: 120 легла — 100 рехабилитационни и 20 за продължително лечение
  - text: Договори с НЗОК (КП 262.1, 263.1, 264, 265.1) и с НОИ
  - text: Природна минерална вода с температура 36°С от собствен сондаж
  - text: Достъп при необходимост до лаборатории и клиники за образна диагностика на ВМА
