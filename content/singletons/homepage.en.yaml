aboutHeading: About BPLR–Bankya
aboutBody: >-
  The Hospital for Long-term Treatment and Rehabilitation – Bankya is a
  specialised medical facility with over 110 years of history, part of the
  Military Medical Academy, located in the scenic town of Bankya, renowned for
  its unique mineral springs.
aboutBody2: >-
  We offer comprehensive rehabilitation for patients recovering from stroke,
  trauma, cardiac and orthopaedic conditions, combining the natural resources of
  the area with modern treatment methods and a highly qualified medical team.
aboutBullets:
  - text: Level II accredited medical facility
  - text: NHIF contract for clinical pathway admissions
  - text: Natural mineral water with proven therapeutic effect
  - text: Individual rehabilitation plan for each patient
ctaHeading: Ready to Begin?
ctaBody: >-
  Contact us for information about admission, clinical pathways and available
