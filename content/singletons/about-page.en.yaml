missionHeading: Our Mission
missionBody: >-
  BPLR–Bankya is a hospital for long-term treatment and rehabilitation under the
  Military Medical Academy — a specialised medical facility with over 110 years
  of history. Our mission is to deliver physical treatment, motor and
  psychological rehabilitation, balneotherapy, terrain and climate therapy for
  patients with chronic conditions, as well as early rehabilitation after acute
  hospital treatment.
missionBody2: >-
  We work in three main areas: early rehabilitation immediately after acute
  treatment; long-term treatment with subsequent rehabilitation; and primary and
  secondary prevention. Our highly qualified staff use the therapeutic properties
  of mineral water and the natural factors of Bankya, combined with
  physiotherapy and pharmacological treatment.
missionBullets:
  - text: Founded on 12 July 1913 — Bulgaria's first military sanatorium
  - text: 120 beds — 100 rehabilitation and 20 long-term treatment
  - text: Contracts with NHIF (CP 262.1, 263.1, 264, 265.1) and NSI
  - text: Natural mineral water at 36°C from our own borehole
  - text: Access to VMA laboratories and clinics when needed
