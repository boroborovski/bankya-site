mineralHeading: Bankya's Mineral Water
mineralBody: >-
  The hospital uses natural mineral water from Borehole No. 2хг, located
  directly next to the building — with a depth of 364.12 m, flow rate of
  0.38–5 l/s and temperature of 36°C. The water is alkaline (pH 7.3),
  homathermal, lightly mineralised, hydrocarbon-sulphate-sodium-nitrogen.
  Total ionic sum: 333.28 mg/l.
mineralBody2: >-
  Key components (mg/l): Fluoride 1.60 · Chloride 9.02 · Sulphate 65.43 ·
  Bicarbonate 26.19 · Sodium 70.32 · Potassium 4.06 · Calcium 2.45 ·
  Meta-silicic acid 52.65 · Meta-boric acid 4.47. Water treatment procedures
  include mineral baths (standard, hydromassage, whirlpool), a mineral pool and
  drinking therapy.
mineralBullets:
