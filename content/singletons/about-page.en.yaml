  - text: Mineral pool and drinking therapy
timelineEvents:
  - year: "1913"
    title: Foundation of the Soldiers' Sanatorium
    description: >-
      On 12 July 1913, the Soldiers' Sanatorium in Bankya was opened —
      Bulgaria's first military sanatorium. Created to treat those wounded and
      ill from the Balkan Wars, it provided food, accommodation, medical care
      and mineral baths.
  - year: "1915"
    title: Officers' Ward with 25 Beds
    description: >-
      An officers' ward with 25 beds was established at the sanatorium by order
      of the commander of the First Sofia Divisional Hospital.
  - year: "1926"
    title: Ivanov Family Donation
    description: >-
      Reserve Major Nikola K. Ivanov and his wife Elena donated 1 million leva
      (later tripled) and 1,699 sq.m. of land for the construction of a
      sanatorium for war invalids.
  - year: "1928"
    title: New Building Completed — Block B
    description: >-
      In May 1928, the sanatorium was completed and opened. The building was
      constructed with a donation from the Domna and Mihail Tenevi family in
      memory of their son Major Kosta Panitsa, who died in battle.
  - year: "1955"
    title: Military Sanatorium under the Medical Directorate
    description: >-
      Established as a military sanatorium with gradual specialisation in
      treatment and recovery from cardiovascular, cerebrovascular and
      neurological conditions.
  - year: "1971"
    title: New Eight-storey Building — Block A
    description: >-
      Completed and commissioned in April 1971. A hydrotherapy unit,
      physiotherapy, two motor rehabilitation halls, functional diagnostics and
      an intensive care unit were added.
  - year: "1998"
    title: Joined the Military Medical Academy
    description: >-
      The sanatorium was incorporated into the structure of the Military Medical
      Academy.
  - year: "2017"
    title: BPLR–Bankya under VMA
    description: >-
      With amendments to the Healthcare Establishments Act, the hospital
      received its current name. Restoration of the cinema hall was completed —
      a unique conference and cultural-entertainment centre.
