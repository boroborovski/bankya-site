aboutHeading: За БПЛР–Банкя
aboutBody: Болницата за продължително лечение и рехабилитация – Банкя е специализирано лечебно заведение с над 110-годишна история към Военномедицинска академия, намиращо се в живописния град Банкя, известен с уникалните си минерални извори.
aboutBody2: Предлагаме комплексно лечение и рехабилитация за пациенти след инсулт, травми, сърдечни и ортопедични заболявания, като съчетаваме природните дадености на района с модерни методи на лечение от висококвалифициран медицински екип.
aboutBullets:
  - text: Акредитирано лечебно заведение от II ниво
  - text: Договор с НЗОК по клинични пътеки
  - text: Природна минерална вода с доказан лечебен ефект
  - text: Индивидуален рехабилитационен план за всеки пациент
ctaHeading: Прием в БПЛР-Банкя към ВМА
ctaBody: |-
  Планиране на прием по клинични пътеки, по програма на НОИ и по Наредба Н-2/2021 година 
  само в делнични дни на телефони 028127920 и 029977194 от 13:30 до 15:30 часа.
