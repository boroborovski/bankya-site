aboutHeading: За БПЛР–Банкя
aboutBody: >-
  Болницата за продължително лечение и рехабилитация – Банкя е специализирано
  лечебно заведение с над петдесетгодишна история, намиращо се в живописния град
  Банкя, известен с уникалните си минерални извори.
aboutBody2: >-
  Предлагаме комплексна рехабилитация за пациенти след инсулт, травми, сърдечни
  и ортопедични заболявания, като съчетаваме природните дадености на района с
  модерни методи на лечение и висококвалифициран медицински екип.
aboutBullets:
  - text: Акредитирано лечебно заведение от II ниво
  - text: Договор с НЗОК по клинични пътеки
  - text: Природна минерална вода с доказан лечебен ефект
  - text: Индивидуален рехабилитационен план за всеки пациент
ctaHeading: Готови сте да започнете?
ctaBody: Свържете се с нас за информация за прием, клинични пътеки и свободни места.
